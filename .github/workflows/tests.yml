name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install homeassistant pytest
      - name: Run tests
        run: pytest tests/ -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate frontend JavaScript syntax
        run: node --check custom_components/recettes_express/www/recettes-express-card.js
